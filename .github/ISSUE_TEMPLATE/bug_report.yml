name: Bug report
description: Report a reproducible Busymate AI product problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Please redact screenshots and logs. Never include credentials or customer data.
  - type: input
    id: surface
    attributes:
      label: Affected surface
      placeholder: Console, chat, widget, desktop, or a specific integration
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or app version and operating system
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or other evidence
